# Reusable MRI/NIfTI template. See configs/examples/curated_busi for US/PNG.
modality: 'MRI'

formats:
  image: '.nii.gz'
  segmentation: '.nii.gz'
  prediction: '.nii.gz'

sequences:
  - '_t1'
  - '_t2'
  - '_t1ce'
  - '_flair'

labels:
  BKG: 0
  EDE: 3
  ENH: 1
  NEC: 2

datasets_path: './datasets'
features_path: './outputs/features'
metrics_path: './outputs/metrics'

raw_datasets:
  dataset_1: "${datasets_path}/dataset_1/images"

features:
  dataset_1: "${features_path}/extracted_information_dataset_1.csv"

metrics:
  dataset_1: "${metrics_path}/extracted_information_dataset_1.csv"

predictions:
  dataset_1:
    modelA: "${datasets_path}/dataset_1/predictions/modelA"
