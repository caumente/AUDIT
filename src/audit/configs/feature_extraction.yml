# Reusable MRI/NIfTI template. See configs/examples/curated_busi for US/PNG.
data_paths:
  dataset_1: '/path/to/dataset_1/images'

modality: 'MRI'

formats:
  image: '.nii.gz'
  segmentation: '.nii.gz'

sequences:
  - '_t1'
  - '_t2'
  - '_t1ce'
  - '_flair'

labels:
  BKG: 0
  EDE: 3
  ENH: 1
  NEC: 2

features:
  statistical: true
  texture: true
  spatial: true
  tumor: true

preprocessing: {}

output_path: './outputs/features'
logs_path: './logs/features'
cpu_cores: 8
