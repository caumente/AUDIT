# Reusable MRI/NIfTI template. See configs/examples/curated_busi for US/PNG.
data_path: '/path/to/dataset_1/images'

modality: 'MRI'

formats:
  image: '.nii.gz'
  segmentation: '.nii.gz'
  prediction: '.nii.gz'

model_predictions_paths:
  modelA: '/path/to/dataset_1/predictions/modelA'

labels:
  BKG: 0
  EDE: 3
  ENH: 1
  NEC: 2

backend: audit

# Canonical names are identical for audit, pymia, and metricsreloaded.
metrics:
  dice: true
  jaccard: true
  accuracy: true
  precision: true
  sensitivity: true
  specificity: true
  hausdorff_distance: true
  predicted_size: true

output_path: './outputs/metrics'
filename: 'dataset_1'
logs_path: './logs/metric'
cpu_cores: 8
